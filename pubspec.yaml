name: ai_student_assistant
description: "AI-powered productivity app for college students - built for Flutter internship portfolio."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.0
  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  google_sign_in: ^6.2.1
  # Networking (REST + AI API calls)
  dio: ^5.5.0+1
  # Local persistence / env
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3
  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  gpt_markdown: ^1.0.0 # renders AI chat replies as proper formatted markdown (ChatGPT-style)
  # Files
  file_picker: 12.0.0 # pinned exact — v12 changed the API shape (see ai_chat_screen.dart)
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  syncfusion_flutter_pdf: ^26.2.14 # extracts plain text from uploaded PDFs
  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  dartz: ^0.10.1 # Either<Failure, T> for clean error handling in repositories
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/icon/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1C1B33"
  adaptive_icon_foreground: "assets/icon/icon.png"